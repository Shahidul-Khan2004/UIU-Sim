spring:
  datasource:
    url: jdbc:h2:mem:uiu;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

uiu:
  clerk:
    publishable-key: pk_test_dummy
    issuer: https://example.clerk.accounts.dev
    jwks-url: https://example.clerk.accounts.dev/.well-known/jwks.json
    authorized-parties: http://localhost:8080
  gemini:
    api-key: test-gemini-key
    model: gemini-3.1-flash-lite
    temperature: 0.2
    max-output-tokens: 350
    timeout-seconds: 15
