server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: uiu-simulator-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

uiu:
  clerk:
    publishable-key: ${CLERK_PUBLISHABLE_KEY}
    secret-key: ${CLERK_SECRET_KEY:}
    issuer: ${CLERK_ISSUER}
    jwks-url: ${CLERK_JWKS_URL}
    authorized-parties: ${CLERK_AUTHORIZED_PARTIES:http://localhost:8080}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
    temperature: ${GEMINI_TEMPERATURE:0.2}
    max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:350}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:15}

logging:
  level:
    root: INFO
    com.uiusimulator: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level %logger{36} [requestId=%X{requestId}] - %msg%n"
